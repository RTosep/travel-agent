[project]
name = "travel-agent"
version = "0.1.0"
description = "A hand-rolled travel planning agent in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "json-repair>=0.30.0",
    "mcp>=1.0.0",
    "openai>=2.0.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
travel-agent = "travel_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
